name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install JS deps (npm ci)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (vite)
        run: npm run build

      - name: Install Linux deps for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo test (lib)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: List E2E (E2E_MOCK)
        run: npx playwright test --list
        env:
          E2E_MOCK: 'true'

      - name: Start Vite dev server
        run: |
          npm run dev -- --host 0.0.0.0 --port 1420 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 30); do
            if curl -s http://localhost:1420 > /dev/null; then
              echo "Vite ready"
              break
            fi
            sleep 2
          done
          curl -s http://localhost:1420 | head -n 20

      - name: Run E2E with mock
        run: npx playwright test
        env:
          E2E_MOCK: 'true'

      - name: Stop Vite
        if: always()
        run: kill $(cat /tmp/vite.pid) || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
