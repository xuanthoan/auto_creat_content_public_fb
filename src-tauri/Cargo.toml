[package]
name = "flowpost-ai"
version = "0.2.0"
description = "Trợ lý nội dung Facebook chạy trên máy tính"
authors = ["FlowPost AI"]
edition = "2021"

[lib]
name = "flowpost_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
keyring = "3"
